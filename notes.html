<style>
  :root{
    --bg:#E4F6FD; --text:#0E2049; --text-2:#4A5C82; --text-3:#596D8A;
    --line:#AED7E7; --card-line:rgba(41,74,255,.4);
    --accent:#294AFF; --accent-hover:#1E3AE0;
    --mint:#37FFA9; --mint-soft:#D9FFEF; --mint-text:#00734D;
    --card:#ffffff; --shadow:0 2px 14px rgba(41,74,255,.07);
    --note-bg:#F8FBFD; --src-bg:#F5F8FF;
    --note-text:#3A4560; --note-lab:#0E2049; --note-strong:#0E2049;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#050B1D; --text:#EAF4FF; --text-2:#9FB3D9; --text-3:#7488AC;
      --line:#1B2A4E; --card-line:rgba(94,120,255,.5);
      --accent:#5E78FF; --accent-hover:#7B90FF;
      --mint:#37FFA9; --mint-soft:#0C3A2B; --mint-text:#37FFA9;
      --card:#0D1730; --shadow:0 2px 14px rgba(0,0,0,.5);
      --note-bg:#141A28; --src-bg:#121D3A;
      --note-text:#C3CBDB; --note-lab:#DCE6F7; --note-strong:#EAF0FA;
    }
  }
  *{box-sizing:border-box; margin:0;}
  /* ---------- 콘텐츠 보호: 드래그·복사 방지 (입력칸 제외) ---------- */
  body{-webkit-user-select:none; -moz-user-select:none; user-select:none;}
  input, textarea{-webkit-user-select:text; -moz-user-select:text; user-select:text;}
  img{-webkit-user-drag:none; user-drag:none;}

  body{
    font-family:"NanumSquareNeo","Apple SD Gothic Neo",-apple-system,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent); text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .marker{background:linear-gradient(transparent 62%, var(--mint) 62%, var(--mint) 92%, transparent 92%); padding:0 3px;}

  nav{
    position:sticky; top:0; z-index:50; height:52px;
    display:flex; align-items:center; gap:22px; padding:0 max(22px,4vw);
    background:color-mix(in srgb, var(--bg) 75%, transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line);
  }
  nav .brand{font-size:15px; font-weight:800; color:var(--text);}
  nav .links{margin-left:auto; display:flex; gap:20px; align-items:center;}
  nav .links a{color:var(--text-2); font-size:13px;}
  nav .links a:hover{color:var(--text); background:linear-gradient(transparent 76%, var(--mint) 76%, var(--mint) 96%, transparent 96%);}
  nav .add-mini{
    background:var(--accent); color:#fff !important; border:none; border-radius:980px;
    font-size:12.5px; padding:6px 14px; font-weight:600;
  }
  nav .add-mini:hover{background:var(--accent-hover) !important;}

  @media (max-width:640px){
    nav{gap:12px; padding:0 16px;}
    nav .brand{font-size:14px; white-space:nowrap;}
    nav .links{gap:13px;}
    nav .links a{font-size:12.5px; white-space:nowrap;}
    nav .add-mini{display:none;}
  }

  /* ---------- 목록 ---------- */
  .wrap{max-width:680px; margin:0 auto; padding:48px 20px 100px;}
  .head h1{font-size:clamp(26px,4.5vw,34px); font-weight:900; letter-spacing:-0.025em;}
  .head p{color:var(--text-2); font-size:14.5px; margin-top:10px;}
  .cats{display:flex; gap:8px; flex-wrap:wrap; margin-top:22px;}
  .cats button{
    border:1px solid var(--line); background:var(--card); color:var(--text-2);
    font-size:13px; font-weight:600; padding:7px 16px; border-radius:980px;
  }
  .cats button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .plist{margin-top:26px;}
  .prow{
    display:block; padding:22px 4px; border-bottom:1px solid var(--line);
    color:var(--text); cursor:pointer;
  }
  .prow:hover .pt{color:var(--accent);}
  .prow .pt{font-size:19px; font-weight:800; letter-spacing:-0.02em; line-height:1.4; transition:color .15s;}
  .prow .pm{font-size:12.5px; color:var(--text-3); margin-top:7px;}
  .prow .pm .cat{margin-right:8px;}
  .prow .px{
    font-size:14px; color:var(--text-2); margin-top:10px; line-height:1.7;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .empty{text-align:center; color:var(--text-3); padding:60px 0; font-size:14px;}

  /* 분류별 색상 (c0~c5 순환) */
  .cat{display:inline-block; padding:2px 9px; border-radius:980px; font-weight:700; font-size:12px;}
  .cat.c0{color:#00734D; background:#D9FFEF;}
  .cat.c1{color:#1E3AE0; background:#E1E8FF;}
  .cat.c2{color:#9A5B00; background:#FFF0D6;}
  .cat.c3{color:#8A2BC4; background:#F4E6FF;}
  .cat.c4{color:#0E7490; background:#DCF5FB;}
  .cat.c5{color:#B03060; background:#FFE4EF;}
  @media (prefers-color-scheme: dark){
    .cat.c0{color:#37FFA9; background:#0C3A2B;}
    .cat.c1{color:#9DB0FF; background:#16224A;}
    .cat.c2{color:#FFD08A; background:#3A2C14;}
    .cat.c3{color:#DCB0FF; background:#2C1A3D;}
    .cat.c4{color:#8FE2F5; background:#0F2E38;}
    .cat.c5{color:#FFA8C8; background:#3A1626;}
  }
  .cats button.on.c0{background:#00734D; border-color:#00734D; color:#fff;}
  .cats button.on.c1{background:#1E3AE0; border-color:#1E3AE0; color:#fff;}
  .cats button.on.c2{background:#9A5B00; border-color:#9A5B00; color:#fff;}
  .cats button.on.c3{background:#8A2BC4; border-color:#8A2BC4; color:#fff;}
  .cats button.on.c4{background:#0E7490; border-color:#0E7490; color:#fff;}
  .cats button.on.c5{background:#B03060; border-color:#B03060; color:#fff;}

  .pager{display:flex; gap:6px; justify-content:center; margin-top:30px; flex-wrap:wrap; align-items:center;}
  .pager button{min-width:34px; height:34px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--text-2); font-size:13.5px; font-weight:600; padding:0 9px;}
  .pager button:hover{border-color:var(--accent); color:var(--accent);}
  .pager button.cur{background:var(--accent); border-color:var(--accent); color:#fff;}
  .pager button:disabled{opacity:.35;}
  .pager .ell{color:var(--text-3); font-size:12px;}

  footer{border-top:1px solid var(--line); padding:32px 20px 56px; text-align:center;}
  footer .f-brand{font-size:14px; font-weight:800;}
  footer p{color:var(--text-3); font-size:12.5px; margin-top:8px;}
</style>

<script>

<script>
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const readMin = t => Math.max(1, Math.round(t.length / 550));  // 분당 550자 기준

/* 글 한 편의 주소. 본문은 p/<슬러그>.html에 미리 만들어 둔 진짜 페이지다
   (build_notes.py가 만든다) — 검색엔진이 글마다 따로 읽어 갈 수 있게. */
const postHref = id => "./p/" + encodeURIComponent((typeof SLUGS !== "undefined" && SLUGS[id]) || id) + ".html";

/* 예전 주소(notes.html#아이디)로 들어온 사람을 새 주소로 넘겨준다 */
(function(){
  const id = decodeURIComponent(location.hash.slice(1));
  if(id && typeof SLUGS !== "undefined" && SLUGS[id]) location.replace(postHref(id));
})();

let activeCat = "전체", page = 1;
const PER_PAGE = 8;

/* 분류별 고정 색상 (분류명 기준 — 어느 페이지에서나 같은 색) */
const catOrder = [...new Set(POSTS.map(p=>p.category).filter(Boolean))];
const catClass = (() => {
    const order = [...new Set(POSTS.map(p=>p.category).filter(Boolean))].sort();
    return c => "c" + (Math.max(0, order.indexOf(String(c||"노트"))) % 6);
  })();

function renderCats(){
  const box = document.getElementById("cats");
  if(catOrder.length < 2){ box.style.display = "none"; return; }
  const counts = { "전체": POSTS.length };
  POSTS.forEach(p => counts[p.category] = (counts[p.category]||0)+1);
  box.innerHTML = ["전체", ...catOrder].map(c => {
    const cls = c==="전체" ? "" : catClass(c);
    return `<button class="${c===activeCat?"on "+cls:cls} " data-c="${esc(c)}">${esc(c)} <span style="opacity:.55">${counts[c]||0}</span></button>`;
  }).join("");
  box.querySelectorAll("button").forEach(el => el.onclick = () => {
    activeCat = el.dataset.c; page = 1; renderCats(); renderList();
  });
}

function pageWin(cur, total){
  if(total <= 7) return Array.from({length:total},(_,k)=>k+1);
  const set = new Set([1,total,cur-1,cur,cur+1]);
  const list = [...set].filter(p=>p>=1&&p<=total).sort((a,b)=>a-b);
  const out = [];
  list.forEach((p,i)=>{ if(i && p-list[i-1]>1) out.push("…"); out.push(p); });
  return out;
}

function renderList(){
  const all = activeCat==="전체" ? POSTS : POSTS.filter(p=>p.category===activeCat);
  const total = Math.max(1, Math.ceil(all.length / PER_PAGE));
  page = Math.min(page, total);
  const list = all.slice((page-1)*PER_PAGE, page*PER_PAGE);
  document.getElementById("plist").innerHTML = list.length ? list.map(p => `
    <a class="prow" href="${postHref(p.id)}">
      <div class="pt">${esc(p.title)}</div>
      <div class="pm"><span class="cat ${catClass(p.category)}">${esc(p.category||"노트")}</span>${p.d||""} · 약 ${readMin(p.body)}분${p.book ? ` · 『${esc(p.book)}』` : ""}</div>
      <div class="px">${esc(p.body.replace(/[#>*\-`\/]/g," ").replace(/\s+/g," ").trim().slice(0,140))}</div>
    </a>`).join("")
    : `<div class="empty">아직 글이 없어요. 서재 주인의 방에서 첫 글을 발행해 보세요.</div>`;

  document.getElementById("pager").innerHTML = total > 1 ? `
    <button onclick="goPage(${page-1})" ${page===1?"disabled":""}>‹</button>
    ${pageWin(page,total).map(p=>p==="…"?`<span class="ell">…</span>`:`<button class="${p===page?"cur":""}" onclick="goPage(${p})">${p}</button>`).join("")}
    <button onclick="goPage(${page+1})" ${page===total?"disabled":""}>›</button>` : "";
}
function goPage(p){ page = p; renderList(); document.getElementById("listView").scrollIntoView({behavior:"smooth", block:"start"}); }

renderCats(); renderList();
</script>
<script>
/* ---------- 콘텐츠 보호: 복사·잘라내기·드래그·우클릭 차단 (입력칸 제외) ---------- */
(function(){
  const exempt = e => e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA");
  ["copy","cut","dragstart","contextmenu"].forEach(ev =>
    document.addEventListener(ev, e => { if(!exempt(e)) e.preventDefault(); }));
})();
</script>
