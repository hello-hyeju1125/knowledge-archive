  .prow{
    display:flex; align-items:center; gap:18px; padding:16px 4px;
    border-bottom:1px solid var(--line); color:var(--text); cursor:pointer;
  }
  .prow:hover .pt{color:var(--accent);}
  .prow .cat{flex:0 0 auto;}
  .prow .pt{
    flex:1; min-width:0; font-size:18px; font-weight:800; letter-spacing:-0.02em;
    line-height:1.4; transition:color .15s;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .prow .pb{
    flex:0 0 auto; max-width:230px; font-size:12.5px; color:var(--text-3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;

  .prow .pd{flex:0 0 auto; font-size:12.5px; color:var(--text-3); white-space:nowrap;}

    .prow{gap:13px;}

    .prow .pb{display:none;}

  .empty{text-align:center; color:var(--text-3); padding:60px 0; font-size:14px;}

  .cat.c3{color:#8A2BC4; background:#F4E6FF;}

  .cat.c5{color:#B03060; background:#FFE4EF;}

<script>
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const readMin = t => Math.max(1, Math.round(t.length / 550));  // 분당 550자 기준

/* 글 한 편의 주소. 본문은 p/<슬러그>.html에 미리 만들어 둔 진짜 페이지다
   (build_notes.py가 만든다) — 검색엔진이 글마다 따로 읽어 갈 수 있게. */
const postHref = id => "./p/" + encodeURIComponent((typeof SLUGS !== "undefined" && SLUGS[id]) || id) + ".html";

/* 예전 주소(notes.html#아이디)로 들어온 사람을 새 주소로 넘겨준다 */
(function(){
  const id = decodeURIComponent(location.hash.slice(1));
  if(id && typeof SLUGS !== "undefined" && SLUGS[id]) location.replace(postHref(id));
})();

let activeCat = "전체", page = 1;
const PER_PAGE = 8;

/* 분류별 고정 색상 (분류명 기준 — 어느 페이지에서나 같은 색) */
const catOrder = [...new Set(POSTS.map(p=>p.category).filter(Boolean))];
const catClass = (() => {
    const order = [...new Set(POSTS.map(p=>p.category).filter(Boolean))].sort();
    return c => "c" + (Math.max(0, order.indexOf(String(c||"노트"))) % 6);
  })();

function renderCats(){
  const box = document.getElementById("cats");
  if(catOrder.length < 2){ box.style.display = "none"; return; }
  const counts = { "전체": POSTS.length };
  POSTS.forEach(p => counts[p.category] = (counts[p.category]||0)+1);
  box.innerHTML = ["전체", ...catOrder].map(c => {
    const cls = c==="전체" ? "" : catClass(c);
    return `<button class="${c===activeCat?"on "+cls:cls} " data-c="${esc(c)}">${esc(c)} <span style="opacity:.55">${counts[c]||0}</span></button>`;
  }).join("");
  box.querySelectorAll("button").forEach(el => el.onclick = () => {
    activeCat = el.dataset.c; page = 1; renderCats(); renderList();
  });
}

function pageWin(cur, total){
  // 한 번에 열 쪽까지 보여 주고, 그 너머는 화살표로 넘어간다
  const N = 10;
  const start = Math.max(1, Math.min(cur - 4, total - N + 1));
  const end = Math.min(total, start + N - 1);
  return Array.from({length: end - start + 1}, (_, k) => start + k);
}

function renderList(){
  const all = activeCat==="전체" ? POSTS : POSTS.filter(p=>p.category===activeCat);
  const total = Math.max(1, Math.ceil(all.length / PER_PAGE));
  page = Math.min(page, total);
  const list = all.slice((page-1)*PER_PAGE, page*PER_PAGE);
  document.getElementById("plist").innerHTML = list.length ? list.map(p => `
    <a class="prow" href="${postHref(p.id)}">
      <span class="cat ${catClass(p.category)}">${esc(p.category||"노트")}</span>
      <span class="pt">${esc(p.title)}</span>
      ${p.book ? `<span class="pb">『${esc(p.book)}』</span>` : ""}
      <span class="pd">${p.d||""}</span>
    </a>`).join("")
    : `<div class="empty">아직 글이 없어요. 서재 주인의 방에서 첫 글을 발행해 보세요.</div>`;

  document.getElementById("pager").innerHTML = total > 1 ? `
    <button onclick="goPage(${page-1})" ${page===1?"disabled":""}>‹</button>
    ${pageWin(page,total).map(p=>`<button class="${p===page?"cur":""}" onclick="goPage(${p})">${p}</button>`).join("")}
    <button onclick="goPage(${page+1})" ${page===total?"disabled":""}>›</button>` : "";
}
function goPage(p){ page = p; renderList(); document.getElementById("listView").scrollIntoView({behavior:"smooth", block:"start"}); }

renderCats(); renderList();
</script>
<script>
/* ---------- 콘텐츠 보호: 복사·잘라내기·드래그·우클릭 차단 (입력칸 제외) ---------- */
(function(){
  const exempt = e => e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA");
  ["copy","cut","dragstart","contextmenu"].forEach(ev =>
    document.addEventListener(ev, e => { if(!exempt(e)) e.preventDefault(); }));
})();
</script>
