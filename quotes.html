<!DOCTYPE html>
<html lang="ko">
<head>

<style>
@font-face{
  font-family:"NanumSquareNeo";
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/NanumSquareNeo-Variable.woff2") format("woff2");
  font-weight:300 900; font-display:swap;
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --r-img:3px; --r-card:8px; --r-ctl:6px;
    --bg:#F4F7FB; --card:#ffffff;
    --text:#0D1526; --text-2:#4B5568; --text-3:#666F84;
    --line:#DFE5EF;
    --accent:#294AFF; --accent-hover:#1E3AE0;
    --mint:#37FFA9; --mint-soft:#E1FBF0; --mint-text:#00805A; --mint-vivid:#294AFF;
    --shadow:0 1px 2px rgba(13,21,38,.05), 0 6px 20px rgba(13,21,38,.07);
    --nav-bg:#0D1526; --nav-text:#FFFFFF; --nav-text-2:#AEB8CC; --nav-line:#0D1526; --nav-btn:#4E6FFF;
    /* 포스트잇 색 — 장르마다 하나씩 돌아가며 (색이 곧 분류가 되게) */
    --p1:#FFF6D9; --p2:#E4EEFF; --p3:#DFF9EE; --p4:#FFE7F0;
    --p5:#EFEAFF; --p6:#FFEEDD; --p7:#E6F6FF; --p8:#F1F5DC;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#070B14; --card:#101726;
      --text:#EEF2F8; --text-2:#A3AFC2; --text-3:#7F8B9F;
      --line:#1E2739;
      --accent:#7B95FF; --accent-hover:#9AAEFF;
      --mint:#37FFA9; --mint-soft:#0B3228; --mint-text:#37FFA9; --mint-vivid:#7B95FF;
      --shadow:0 2px 14px rgba(0,0,0,.5);
      --nav-bg:#101726; --nav-text:#EEF2F8; --nav-text-2:#A3AFC2; --nav-line:#1E2739; --nav-btn:#7B95FF;
      --p1:#2C2716; --p2:#161F35; --p3:#0E2B22; --p4:#2E1723;
      --p5:#1F1A33; --p6:#2C2119; --p7:#132430; --p8:#22261A;
    }
  }
  *{box-sizing:border-box; margin:0;}
  body{-webkit-user-select:none; -moz-user-select:none; user-select:none;}
  input{-webkit-user-select:text; -moz-user-select:text; user-select:text;}

  body{
    font-family:"NanumSquareNeo","Apple SD Gothic Neo",-apple-system,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent); text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .marker{background:linear-gradient(transparent 62%, var(--mint) 62%, var(--mint) 92%, transparent 92%); padding:0 3px;}

  nav{
    position:sticky; top:0; z-index:50; height:58px;
    display:flex; align-items:center; gap:22px; padding:0 max(22px,4vw);
    background:color-mix(in srgb, var(--nav-bg) 92%, transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--nav-line);
  }
  nav .brand{font-size:17.5px; font-weight:900; color:var(--nav-text); letter-spacing:-0.03em;}
  nav .links{margin-left:auto; display:flex; gap:20px; align-items:center;}
  nav .links a{color:var(--nav-text); font-size:15px; font-weight:700; transition:opacity .15s;}
  nav .links a:hover{opacity:.7;}
  nav .add-mini{
    background:var(--nav-btn); color:#fff !important; border:none; border-radius:var(--r-ctl);
    font-size:12.5px; padding:6px 14px; font-weight:600;
  }
  @media (max-width:640px){
    nav{gap:12px; padding:0 16px;}
    nav .brand{font-size:15.5px; white-space:nowrap;}
    nav .links{gap:13px;}
    nav .links a{font-size:13.5px; white-space:nowrap;}
  }

  .wrap{max-width:1180px; margin:0 auto; padding:44px 20px 100px;}
  .head h1{font-size:clamp(26px,4.5vw,34px); font-weight:900; letter-spacing:-0.025em;}
  .head p{color:var(--text-2); font-size:14.5px; margin-top:10px;}
  .tags{display:flex; gap:7px; flex-wrap:wrap; margin:24px 0 26px;}
  .tags button{
    border:1px solid var(--line); background:var(--card); color:var(--text-2);
    font-size:13px; font-weight:600; padding:7px 15px; border-radius:var(--r-ctl);
  }
  .tags button:hover{border-color:var(--accent); color:var(--accent);}
  .tags button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tags button .n{opacity:.55; margin-left:5px;}

  /* ---------- 문장 벽 ----------
     쪽지 높이가 제각각이라 CSS columns로는 칸마다 끝나는 높이가 크게 어긋난다
     (오른쪽 아래가 텅 빈 것처럼 보였다). 칸을 직접 만들고 가장 짧은 칸에
     하나씩 붙여서 바닥을 맞춘다. */
  .wall{display:flex; align-items:flex-start; gap:18px;}
  .wall .col{flex:1 1 0; min-width:0;}
  .note{
    display:block; width:100%; margin:0 0 18px; padding:0;
    background:none; border:none; text-align:left; color:var(--text);
  }
  .note .inner{
    display:block; background:var(--p5);
    border-radius:var(--r-card); padding:20px 19px 16px;
    box-shadow:var(--shadow);
    transition:transform .2s ease, box-shadow .2s ease;
    will-change:transform;
  }
  /* 누를 수 있다는 신호 — 쪽지를 바로 세우면서 살짝 들어 올린다 */
  .note:hover .inner, .note:focus-visible .inner{
    transform:rotate(0deg) translateY(-4px) scale(1.015);
    box-shadow:0 12px 30px rgba(13,21,38,.18);
  }
  .note:focus{outline:none;}
  .note:focus-visible .inner{outline:2px solid var(--accent); outline-offset:3px;}
  .note .qt{
    font-family:"Noto Serif KR",Georgia,serif; font-weight:400;
    font-size:14.5px; line-height:1.95; letter-spacing:-0.008em;
    word-break:keep-all; white-space:pre-wrap;
  }
  .note .qf{
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
    margin-top:16px; padding-top:12px; border-top:1px solid rgba(13,21,38,.10);
  }
  @media (prefers-color-scheme: dark){ .note .qf{border-top-color:rgba(255,255,255,.12);} }
  .note .qb{font-size:12.5px; font-weight:800; letter-spacing:-0.02em;}
  .note .qa{font-size:11.5px; color:var(--text-2);}
  .note .qd{margin-left:auto; font-size:11px; color:var(--text-2); opacity:.75;}
  .empty{text-align:center; color:var(--text-3); padding:70px 0; font-size:14px;}

  /* 상자 없이 숫자만 — 목록을 훑는 흐름을 끊지 않게 */
  .pager{display:flex; gap:16px; justify-content:center; margin-top:36px; flex-wrap:wrap; align-items:center;}
  .pager button{
    border:none; background:none; padding:2px 0;
    color:var(--text-3); font-size:14px; font-weight:600;
  }
  .pager button:hover{color:var(--accent);}
  .pager button.cur{
    color:var(--text); font-weight:800;
    text-decoration:underline; text-underline-offset:6px; text-decoration-thickness:2px;
  }
  .pager button:disabled{opacity:.3;}
  .pager button:disabled:hover{color:var(--text-3);}

  /* ---------- 문장 모달 ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(13,21,38,.5); display:none;
    align-items:center; justify-content:center; padding:4vh 20px; z-index:120;
  }
  .overlay.show{display:flex;}
  .qmodal{
    position:relative; width:100%; max-width:600px; max-height:90vh; overflow-y:auto;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
    padding:44px 42px 32px; box-shadow:0 20px 60px rgba(13,21,38,.28);
  }
  .qm-x{
    position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line); background:var(--bg); color:var(--text-3); font-size:15px; line-height:1;
  }
  .qm-x:hover{border-color:var(--accent); color:var(--accent);}
  .qm-mark{
    font-family:Georgia,"Times New Roman",serif; font-size:70px; line-height:.7;
    color:var(--accent); display:block; margin-bottom:8px; user-select:none;
  }
  .qm-text{
    font-family:"Noto Serif KR",Georgia,serif; font-weight:400;
    font-size:clamp(16px,2vw,18.5px); line-height:2.05; letter-spacing:-0.008em;
    word-break:keep-all; white-space:pre-wrap;
  }
  .qm-from{
    display:flex; align-items:center; gap:14px;
    margin-top:28px; padding-top:20px; border-top:1px solid var(--line);
  }
  .qm-cover{
    flex:0 0 44px; width:44px; height:64px; border-radius:var(--r-img); overflow:hidden;
    background:var(--bg); box-shadow:var(--shadow);
  }
  .qm-cover img{width:100%; height:100%; object-fit:cover; display:block;}
  .qm-fromtxt{flex:1; min-width:0;}
  .qm-fromtxt .t{font-size:15px; font-weight:800; letter-spacing:-0.02em; line-height:1.4;}
  .qm-fromtxt .a{font-size:12.5px; color:var(--text-3); margin-top:3px;}
  .qm-go{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    font-size:13px; font-weight:700; color:var(--accent);
    background:none; border:none; border-bottom:1px solid transparent; padding:0 0 1px;
  }
  .qm-go:hover{border-bottom-color:currentColor;}

  /* ---------- 모달 안의 책 정보 ---------- */
  .qm-back{
    background:none; border:none; padding:0; margin-bottom:18px;
    font-size:12.5px; font-weight:700; color:var(--text-3);
  }
  .qm-back:hover{color:var(--accent);}
  .bkhead{display:flex; gap:18px; align-items:flex-start;}
  .bkcover{
    flex:0 0 92px; width:92px; height:134px; border-radius:var(--r-img); overflow:hidden;
    background:var(--bg); box-shadow:var(--shadow);
  }
  .bkcover img{width:100%; height:100%; object-fit:cover; display:block;}
  .bkinfo{flex:1; min-width:0;}
  .bkinfo h3{font-size:20px; font-weight:800; letter-spacing:-0.025em; line-height:1.35;}
  .bkinfo .who{font-size:13.5px; color:var(--text-2); margin-top:6px;}
  .bkinfo .st{color:var(--star); font-size:17px; letter-spacing:2px; margin-top:9px;}
  .bkchips{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .bkchips span{
    font-size:11.5px; font-weight:700; color:var(--mint-text); background:var(--mint-soft);
    padding:3px 10px; border-radius:var(--r-ctl);
  }
  .bksec{margin-top:24px;}
  .bklab{font-size:13px; font-weight:800; color:var(--text); margin-bottom:9px;}
  .bklab span{font-size:12px; font-weight:700; color:var(--text-3); margin-left:6px;}
  .bkreview{
    background:var(--bg); border-left:3px solid var(--accent);
    border-radius:0 var(--r-card) var(--r-card) 0; padding:14px 18px;
    font-size:15.5px; line-height:1.85;
  }
  .bkreview.dim{
    font-size:13.5px; font-style:italic; color:var(--text-3);
    border-left-color:var(--line); background:none; padding:2px 0;
  }
  .bkq{
    background:var(--bg); border-radius:var(--r-card); padding:11px 14px; margin-bottom:7px;
    font-size:13.5px; line-height:1.7;
  }
  .bknote{
    display:flex; align-items:center; gap:12px; background:var(--bg);
    border-radius:var(--r-card); padding:10px 14px; margin-bottom:7px; color:var(--text);
  }
  .bknote:hover{background:var(--mint-soft);}
  .bknote .t{flex:1; min-width:0; font-size:13.5px; font-weight:700;}
  .bknote .m{flex:0 0 auto; font-size:11.5px; color:var(--text-3); white-space:nowrap;}
  .bksum{margin-top:22px; border-top:1px solid var(--line); padding-top:15px;}
  .bksum summary{
    font-size:12.5px; font-weight:700; color:var(--text-3); cursor:pointer;
    list-style:none; display:inline-flex; align-items:center; gap:5px;
  }
  .bksum summary::-webkit-details-marker{display:none;}
  .bksum summary::after{content:"▾"; font-size:10px;}
  .bksum[open] summary::after{content:"▴";}
  .bksum .body{margin-top:10px; font-size:13px; line-height:1.8; color:var(--text-2);}
  .bkbuy{margin-top:20px; text-align:right;}
  .bkbuy a{
    display:inline-flex; align-items:center; gap:5px;
    font-size:13px; font-weight:700; color:var(--accent);
    border-bottom:1px solid transparent; padding-bottom:1px;
  }
  .bkbuy a:hover{border-bottom-color:currentColor;}
  @media (max-width:560px){
    .overlay{padding:16px;}
    .qmodal{max-height:88vh; padding:36px 22px 26px;}
    .qm-mark{font-size:56px;}
  }

  footer{
    background:var(--nav-bg); border-top:none; color:var(--nav-text-2);
    padding:44px 24px 52px; text-align:center;
  }
  footer .f-brand{font-size:14px; font-weight:800; color:var(--nav-text);}
  footer p{color:var(--nav-text-2); font-size:12.5px; margin-top:8px;}
  footer .f-copy{font-size:12px; margin-top:18px; opacity:.75; line-height:1.75;}
  footer .f-mail{font-size:12px; margin-top:6px;}
  footer .f-mail a{text-decoration:underline;}
  footer a{color:var(--nav-text-2) !important;}
  footer a:hover{color:var(--nav-text) !important;}
</style>
</head>

<script>
document.write('<script src="books.js?v=' + Date.now() + '"><\/script>');
document.write('<script src="quotes.js?v=' + Date.now() + '"><\/script>');

<script>
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* 책 제목 → 책 (표지·저자를 모달에서 쓴다) */
const BOOK = (() => {
  const m = {};
  BOOKS.forEach(b => { if(!(b.title in m)) m[b.title] = b; });
  return t => m[t] || null;
})();
const authorOf = t => (BOOK(t)?.author) || "";

/* 문장의 분류는 그 문장이 나온 책의 장르다 — 책이 하나의 출처이므로
   따로 적어 두지 않고 books.js에서 끌어온다. 장르가 여럿이면 모두 해당된다. */
const genresOf = t => {
  const b = BOOK(t);
  const g = (b && b.genres) ? b.genres.filter(Boolean) : [];
  return g.length ? g : ["기타"];
};
const counts = {};
QUOTES.forEach(q => genresOf(q.b).forEach(g => counts[g] = (counts[g] || 0) + 1));
// 문장이 많은 장르부터
const TAGS = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));

/* 쪽지 색 — 장르마다 하나씩 돌아가며 (색이 곧 분류) */
const PALETTE = 8;
const tone = g => (Math.abs([...g].reduce((a, c) => a * 31 + c.charCodeAt(0), 7)) % PALETTE) + 1;
const PER_PAGE = 30;
let active = "전체", page = 1;

const filtered = () => active === "전체" ? QUOTES : QUOTES.filter(q => genresOf(q.b).includes(active));

function renderTags(){
  const box = document.getElementById("tags");
  box.innerHTML = ["전체", ...TAGS].map(t =>
    `<button class="${t===active?"on":""}" data-t="${esc(t)}">${esc(t)}<span class="n">${
      t==="전체" ? QUOTES.length : (counts[t]||0)}</span></button>`).join("");
  box.querySelectorAll("button").forEach(el => el.onclick = () => {
    active = el.dataset.t; page = 1; renderTags(); renderWall();
  });
}

function pageWin(cur, total){
  // 한 번에 열 쪽까지 보여 주고, 그 너머는 화살표로 넘어간다
  const N = 10;
  const start = Math.max(1, Math.min(cur - 4, total - N + 1));
  const end = Math.min(total, start + N - 1);
  return Array.from({length: end - start + 1}, (_, k) => start + k);
}

function renderWall(){
  const all = filtered();
  const total = Math.max(1, Math.ceil(all.length / PER_PAGE));
  page = Math.min(Math.max(1, page), total);
  const list = all.slice((page-1)*PER_PAGE, page*PER_PAGE);

  const wall = document.getElementById("wall");
  wall.innerHTML = "";
  if(!list.length){
    wall.innerHTML = `<div class="empty">이 분류에는 아직 문장이 없어요.</div>`;
  } else {
    // 화면 폭에 맞춘 칸 수
    const w = window.innerWidth;
    const nCol = w <= 480 ? 1 : w <= 760 ? 2 : w <= 1080 ? 3 : 4;
    const cols = Array.from({length:nCol}, () => {
      const d = document.createElement("div"); d.className = "col"; wall.appendChild(d); return d;
    });
    list.forEach((q, i) => {
      const gs = genresOf(q.b);
      const tag = active !== "전체" && gs.includes(active) ? active : gs[0];
      const a = authorOf(q.b);
      // 아주 살짝 기울여 손으로 붙인 느낌만 낸다 (읽기를 방해하지 않는 범위)
      const tilt = [-0.6, 0.5, -0.3, 0.7, -0.5, 0.4][i % 6];
      const el = document.createElement("button");
      el.className = "note";
      el.setAttribute("aria-label", "문장 크게 보기");
      el.innerHTML = `
        <span class="inner" style="background:var(--p${tone(tag)}); transform:rotate(${tilt}deg);">
          <span class="qt">${esc(q.t)}</span>
          <span class="qf">
            <span class="qb">${esc(q.b || "")}</span>
            ${a ? `<span class="qa">${esc(a)}</span>` : ""}
            ${q.d ? `<span class="qd">${esc(q.d)}</span>` : ""}
          </span>
        </span>`;
      el.onclick = () => openQuote(q);
      // 지금 가장 짧은 칸에 붙인다 — 붙일 때마다 재보므로 바닥이 고르게 맞는다
      cols.reduce((a, b) => a.offsetHeight <= b.offsetHeight ? a : b).appendChild(el);
    });
  }

  document.getElementById("pager").innerHTML = total > 1 ? `
    <button onclick="goPage(${page-1})" ${page===1?"disabled":""}>‹</button>
    ${pageWin(page,total).map(p=>`<button class="${p===page?"cur":""}" onclick="goPage(${p})">${p}</button>`).join("")}
    <button onclick="goPage(${page+1})" ${page===total?"disabled":""}>›</button>` : "";
}
function goPage(p){
  page = p; renderWall();
  document.querySelector(".wrap").scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------- 인용구 모달 ---------- */
const overlay = document.getElementById("qOverlay");
function openQuote(q){
  if(!q) return;
  const b = BOOK(q.b);
  document.getElementById("qmText").textContent = q.t;
  document.getElementById("qmTitle").textContent = q.b || "";
  document.getElementById("qmAuthor").textContent =
    [b?.author, b?.platform || b?.publisher].filter(Boolean).join(" · ");
  document.getElementById("qmCover").innerHTML = b?.cover
    ? `<img src="${esc(b.cover)}" alt="${esc(q.b)} 표지" />` : "";
  const go = document.getElementById("qmGo");
  go.style.display = b ? "" : "none";
  go.onclick = () => showBook(b);
  showView("quote");
  overlay.classList.add("show");
  document.body.style.overflow = "hidden";
  document.querySelector(".qmodal").scrollTop = 0;
}
function closeQuote(){
  overlay.classList.remove("show");
  document.body.style.overflow = "";
  showView("quote");             // 다음에 열 때는 늘 문장부터
}

/* ---------- 같은 모달 안에서 문장 ↔ 책 ---------- */
function showView(which){
  document.getElementById("viewQuote").hidden = which !== "quote";
  document.getElementById("viewBook").hidden  = which !== "book";
  document.querySelector(".qmodal").scrollTop = 0;
}
document.getElementById("qmBack").onclick = () => showView("quote");

const QUOTE_PREVIEW = 5;
const bkey = s2 => String(s2||"").trim().toLowerCase().replace(/\s+/g,"");
const postsFor = b => (typeof POSTS === "undefined") ? []
  : POSTS.filter(p => p.book && bkey(p.book) === bkey(b.title));
const postHref = p => "./p/" + encodeURIComponent((typeof SLUGS !== "undefined" && SLUGS[p.id]) || p.id) + ".html";
const quotesOf = b => [
  ...QUOTES.filter(q => q.b === b.title),
  ...(b.quotes || []).map(t => ({ t, tag:"", d:"" })),
];
const buyHref = b => b.type === "webtoon"
  ? (b.link || "https://comic.naver.com")
  : "https://search.kyobobook.co.kr/search?keyword=" + encodeURIComponent(b.isbn || b.title);
const stars = n => "★★★★★☆☆☆☆☆".slice(5-(n||0), 10-(n||0));

let bkQuotesAll = false;
function showBook(b){
  if(!b) return;
  bkQuotesAll = false;
  renderBook(b);
  showView("book");
}
function renderBook(b){
  const qs = quotesOf(b), ps = postsFor(b);
  const shown = bkQuotesAll ? qs : qs.slice(0, QUOTE_PREVIEW);
  const who = [b.author || "저자 미상", b.platform || b.publisher,
               b.published ? b.published + "년 출간" : "",
               b.readYear ? b.readYear + "년에 읽음" : ""].filter(Boolean).map(esc).join(" · ");
  document.getElementById("bookBody").innerHTML = `
    <div class="bkhead">
      <div class="bkcover">${b.cover ? `<img src="${esc(b.cover)}" alt="${esc(b.title)} 표지" />` : ""}</div>
      <div class="bkinfo">
        <h3>${esc(b.title)}</h3>
        <div class="who">${who}</div>
        ${b.rating ? `<div class="st">${stars(b.rating)}</div>` : ""}
        ${(b.genres||[]).length ? `<div class="bkchips">${b.genres.map(g=>`<span>${esc(g)}</span>`).join("")}</div>` : ""}
      </div>
    </div>

    <div class="bksec"><div class="bklab">내 리뷰</div>
      ${b.review ? `<div class="bkreview">${esc(b.review)}</div>`
                 : `<div class="bkreview dim">아직 리뷰를 쓰지 않았어요.</div>`}
    </div>

    ${qs.length ? `<div class="bksec"><div class="bklab">수집한 문장<span>${qs.length}개</span></div>
      ${shown.map(q => `<div class="bkq">${esc(q.t)}</div>`).join("")}
      ${qs.length > QUOTE_PREVIEW ? `<button class="qm-back" id="bkMore" style="margin:4px 0 0; color:var(--accent);">${
        bkQuotesAll ? "접기" : `문장 ${qs.length - QUOTE_PREVIEW}개 더 보기`}</button>` : ""}
    </div>` : ""}

    ${ps.length ? `<div class="bksec"><div class="bklab">이 책에서 쓴 생각 노트<span>${ps.length}편</span></div>
      ${ps.map(p => `<a class="bknote" href="${postHref(p)}">
        <span class="t">${esc(p.title)}</span>
        <span class="m">${esc(p.category||"노트")}${p.d ? " · " + esc(p.d) : ""}</span></a>`).join("")}
    </div>` : ""}

    ${b.summary ? `<details class="bksum"><summary>책 소개 보기</summary>
      <div class="body">${esc(b.summary)}</div></details>` : ""}

    <div class="bkbuy"><a href="${esc(buyHref(b))}" target="_blank" rel="noopener">${
      b.type==="webtoon" ? "네이버웹툰에서 보기" : "교보문고에서 보기"} →</a></div>`;

  const more = document.getElementById("bkMore");
  if(more) more.onclick = () => { bkQuotesAll = !bkQuotesAll; renderBook(b); };
}
document.getElementById("qmClose").onclick = closeQuote;
overlay.onclick = e => { if(e.target === overlay) closeQuote(); };
document.addEventListener("keydown", e => {
  if(e.key !== "Escape" || !overlay.classList.contains("show")) return;
  if(!document.getElementById("viewBook").hidden) showView("quote");   // 한 걸음만 뒤로
  else closeQuote();
});

renderTags(); renderWall();

let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(renderWall, 150); });
</script>

  ["copy","cut","dragstart","contextmenu"].forEach(ev =>
    document.addEventListener(ev, e => { if(!exempt(e)) e.preventDefault(); }));
})();
