<style>
@font-face{
  font-family:"NanumSquareNeo";
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/NanumSquareNeo-Variable.woff2") format("woff2");

<style>
  :root{
    --r-img:3px;
    --r-card:8px;
    --r-ctl:6px;
    --bg:#F4F7FB;
    --text:#0D1526;
    --text-2:#4B5568;
    --text-3:#666F84;
    --line:#DFE5EF;
    --accent:#294AFF;
    --accent-hover:#1E3AE0;
    --mint:#37FFA9;
    --mint-soft:#E1FBF0;
    --mint-text:#00805A;
    --star:#294AFF;
    --card:#ffffff;
    --soft:#F4F7FB;
    --shadow:0 1px 2px rgba(13,21,38,.05), 0 6px 20px rgba(13,21,38,.07);
    --shadow-lg:0 10px 34px rgba(13,21,38,.15);
    --ph1:#EEF2F8;
    --ph2:#EBF0F8;
    --ph3:#EAF6F1;
    --ph4:#EDF1F7;
    --ph5:#ECF0F8;
    --nav-bg:#0D1526;
    --nav-text:#FFFFFF;
    --nav-text-2:#AEB8CC;
    --nav-line:#0D1526;
    --nav-btn:#4E6FFF;
  
    --mint-vivid:#294AFF;
  }
  @media (prefers-color-scheme: dark){
    :root{
    --bg:#070B14;
    --text:#EEF2F8;
    --text-2:#A3AFC2;
    --text-3:#7F8B9F;
    --line:#1E2739;
    --accent:#7B95FF;
    --accent-hover:#9AAEFF;
    --mint:#37FFA9;
    --mint-soft:#0B3228;
    --mint-text:#37FFA9;
    --star:#7B95FF;
    --card:#101726;
    --soft:#101726;
    --shadow:0 2px 14px rgba(0,0,0,.5);
    --shadow-lg:0 10px 34px rgba(0,0,0,.65);
    --ph1:#161E2E;
    --ph2:#141C2B;
    --ph3:#122420;
    --ph4:#151D2C;
    --ph5:#131B2A;
    --nav-bg:#101726;
    --nav-text:#EEF2F8;
    --nav-text-2:#A3AFC2;
    --nav-line:#1E2739;
    --nav-btn:#7B95FF;
  
    --mint-vivid:#7B95FF;
  }
  }
  *{box-sizing:border-box; margin:0;}
  /* ---------- 콘텐츠 보호: 드래그·복사 방지 (입력칸 제외) ---------- */
  body{-webkit-user-select:none; -moz-user-select:none; user-select:none;}
  input, textarea, select{-webkit-user-select:text; -moz-user-select:text; user-select:text;}
  img{-webkit-user-drag:none; user-drag:none;}

  body{
    font-family:"NanumSquareNeo","Apple SD Gothic Neo",-apple-system,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent); text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .marker{background:linear-gradient(transparent 62%, var(--mint) 62%, var(--mint) 92%, transparent 92%); padding:0 3px;}

  nav{
    position:sticky; top:0; z-index:50; height:52px;
    display:flex; align-items:center; gap:22px; padding:0 max(22px,4vw);
    background:color-mix(in srgb, var(--nav-bg) 92%, transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--nav-line);
  }
  nav .brand{font-size:15px; font-weight:800; color:var(--nav-text);}
  nav .links{margin-left:auto; display:flex; gap:20px; align-items:center;}
  nav .links a{color:var(--nav-text-2); font-size:13px;}
  nav .links a:hover{color:var(--nav-text);}
  nav .add-mini{
    background:var(--nav-btn); color:#fff !important; border:none; border-radius:var(--r-ctl);
    font-size:12.5px; padding:6px 14px; font-weight:600;
  }
  nav .add-mini:hover{background:var(--accent-hover) !important;}
  @media (max-width:640px){
    nav{gap:12px; padding:0 16px;}
    nav .brand{font-size:14px; white-space:nowrap;}
    nav .links{gap:13px;}
    nav .links a{font-size:12.5px; white-space:nowrap;}
    nav .add-mini{display:none;}
  }

  .wrap{max-width:1080px; margin:0 auto; padding:44px 20px 100px;}
  .head h1{font-size:clamp(26px,4.5vw,34px); font-weight:900; letter-spacing:-0.025em;}
  .head p{color:var(--text-2); font-size:14.5px; margin-top:10px;}

  /* ---------- 정렬·필터 ---------- */
  .tools{margin-top:24px; border:1px solid var(--line); border-radius:var(--r-img); background:var(--card); padding:14px 16px;}
  .trow{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .trow + .trow{margin-top:11px; padding-top:11px; border-top:1px dashed var(--line);}
  .tlab{
    flex:0 0 64px; font-size:11.5px; font-weight:700; color:var(--text-3);
    letter-spacing:.04em; white-space:nowrap;
  }
  .chips{display:flex; gap:6px; flex-wrap:wrap; flex:1; min-width:0;}
  .chips button{
    border:1px solid var(--line); background:var(--bg); color:var(--text-2);
    font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:var(--r-ctl);
  }
  .chips button:hover{border-color:var(--accent); color:var(--accent);}
  .chips button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .chips button .n{opacity:.55; margin-left:4px; font-weight:600;}
  select{
    font-family:inherit; font-size:12.5px; font-weight:600; color:var(--text-2);
    background:var(--bg); border:1px solid var(--line); border-radius:var(--r-ctl);
    padding:6px 12px; max-width:100%; cursor:pointer;
  }
  select:focus{outline:none; border-color:var(--accent); color:var(--accent);}
  .tsum{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-top:14px; font-size:13px; color:var(--text-2);
  }
  .tsum b{color:var(--text); font-weight:800;}
  .reset{
    border:none; background:none; color:var(--accent); font-size:12.5px;
    font-weight:700; padding:0; text-decoration:underline;
  }

  /* ---------- 목록 ---------- */
  .blist{margin-top:8px;}
  .bitem{border-bottom:1px solid var(--line);}
  /* 모든 줄이 같은 칸 규격을 쓴다 — 눈이 세로로 훑어 내려갈 수 있게 */
  .brow{
    display:grid; width:100%; align-items:center; gap:22px;
    grid-template-columns:60px minmax(0,1fr) 106px 300px 58px;
    text-align:left; padding:14px 4px; background:none; border:none; color:var(--text);
  }
  .brow:hover .bt{color:var(--accent);}
  .cover{
    display:block; flex:0 0 60px; width:60px; height:87px; border-radius:var(--r-img); overflow:hidden;
    background:var(--soft); box-shadow:var(--shadow); position:relative;
  }
  .cover img{width:100%; height:100%; object-fit:cover; display:block;}
  .cover .ph{width:100%; height:100%; display:flex; align-items:center; padding:6px;}
  .cover .ph span{
    font-size:9.5px; font-weight:800; line-height:1.35; color:var(--text-2);
    display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;
  }
  .wbadge{
    position:absolute; top:4px; left:4px; background:var(--mint); color:#063a26;
    font-size:8.5px; font-weight:800; padding:1px 5px; border-radius:var(--r-ctl);
  }
  .bt{
    min-width:0; font-size:17.5px; font-weight:800; letter-spacing:-0.022em; line-height:1.35;
    transition:color .15s;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .bwho{
    min-width:0; font-size:13px; color:var(--text-2); line-height:1.5;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .bwho .sep{color:var(--text-3); margin:0 5px;}
  .byear{font-size:13px; color:var(--text-3); text-align:right; white-space:nowrap;}
  .brate{white-space:nowrap;}
  .brate .st{color:var(--star); font-size:18px; letter-spacing:2px;}
  .brate .no{font-size:12px; color:var(--text-3);}
  .bitem.open .bt{color:var(--accent);}

  /* ---------- 펼친 상세 ---------- */
  /* ---------- 펼친 상세 ----------
     위계: ① 내 리뷰 ② 내가 모은 것(문장·노트) ③ 참고(책 소개).
     예전에는 넷이 같은 크기·같은 회색이라 무엇부터 봐야 할지 알 수 없었다. */
  .bdetail{padding:4px 4px 26px;}
  .dcard{background:var(--soft); border-radius:var(--r-card); padding:22px 22px 24px;}
  .dchips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
  .dchips span{
    font-size:11.5px; font-weight:700; color:var(--mint-text); background:var(--mint-soft);
    padding:3px 10px; border-radius:var(--r-ctl);
  }
  .dsec + .dsec{margin-top:24px;}
  .dlab{display:flex; align-items:baseline; gap:7px; margin-bottom:10px;}
  .dlab b{font-size:13.5px; font-weight:800; letter-spacing:-0.015em; color:var(--text);}
  .dlab span{font-size:12px; font-weight:700; color:var(--text-3);}

  /* ① 내 리뷰 — 이 화면에서 가장 큰 글자 */
  .dreview{
    background:var(--card); border-left:3px solid var(--accent);
    border-radius:0 var(--r-card) var(--r-card) 0; padding:16px 20px;
    font-size:16.5px; line-height:1.85; color:var(--text);
  }
  .dreview.dim{
    font-size:14px; font-style:italic; color:var(--text-3);
    border-left-color:var(--line); background:none; padding:2px 0;
  }

  /* ③ 책 소개 — 남이 쓴 글이라 접어 둔다 */
  .dsum{margin-top:24px; border-top:1px solid var(--line); padding-top:16px;}
  .dsum summary{
    font-size:12.5px; font-weight:700; color:var(--text-3); cursor:pointer;
    list-style:none; display:inline-flex; align-items:center; gap:5px;
  }
  .dsum summary::-webkit-details-marker{display:none;}
  .dsum summary::after{content:"▾"; font-size:10px;}
  .dsum[open] summary::after{content:"▴";}
  .dsum summary:hover{color:var(--accent);}
  .dsum .body{margin-top:11px; font-size:13.5px; line-height:1.8; color:var(--text-2);}
  .dquote{
    background:var(--card); border-radius:var(--r-card); padding:12px 15px; margin-bottom:8px;
    font-size:14px; line-height:1.7;
  }
  .dquote::before{content:"“"; color:var(--mint-vivid); font-weight:800; margin-right:2px;}
  .dquote .qm{display:block; margin-top:5px; font-size:11px; color:var(--text-3);}
  /* 제목은 왼쪽, 분류·날짜는 오른쪽 — 줄마다 오른쪽 끝이 맞아 훑기 쉽다 */
  .dnote{
    display:flex; align-items:center; gap:12px; background:var(--card); border-radius:var(--r-card);
    padding:11px 15px; margin-bottom:8px; color:var(--text);
  }
  .dnote:hover{background:var(--mint-soft);}
  .dnote .t{flex:1; min-width:0; font-size:14px; font-weight:700; line-height:1.45;}
  .dnote .m{flex:0 0 auto; font-size:11.5px; color:var(--text-3); text-align:right; white-space:nowrap;}
  .more{
    background:none; border:1px solid var(--line); border-radius:var(--r-ctl); color:var(--accent);
    font-size:12.5px; font-weight:600; padding:6px 15px; margin-top:2px;
  }
  .more:hover{border-color:var(--accent);}
  .dbuy{margin-top:20px; text-align:right;}
  /* 바깥으로 나가는 링크는 조용한 글자로 — 여기서 할 주요 행동이 아니다 */
  .golink{
    display:inline-flex; align-items:center; gap:5px;
    font-size:13px; font-weight:700; color:var(--accent);
    border-bottom:1px solid transparent; padding-bottom:1px;
  }
  .golink:hover{border-bottom-color:currentColor;}

  .empty{text-align:center; color:var(--text-3); padding:60px 0; font-size:14px;}

  /* 상자 없이 숫자만 — 목록을 훑는 흐름을 끊지 않게 */
  .pager{display:flex; gap:16px; justify-content:center; margin-top:36px; flex-wrap:wrap; align-items:center;}
  .pager button{
    border:none; background:none; padding:2px 0;
    color:var(--text-3); font-size:14px; font-weight:600;
  }
  .pager button:hover{color:var(--accent);}
  .pager button.cur{
    color:var(--text); font-weight:800;
    text-decoration:underline; text-underline-offset:6px; text-decoration-thickness:2px;
  }
  .pager button:disabled{opacity:.3;}
  .pager button:disabled:hover{color:var(--text-3);}

  footer{
    background:var(--nav-bg); border-top:none; color:var(--nav-text-2);
    padding:44px 24px 52px; text-align:center;
  }
  footer .f-brand{font-size:14px; font-weight:800; color:var(--nav-text);}
  footer p{color:var(--nav-text-2); font-size:12.5px; margin-top:8px;}
  footer a{color:var(--nav-text-2) !important;}
  footer a:hover{color:var(--nav-text) !important;}

  @media (max-width:560px){
    .tlab{flex-basis:100%;}
    .cover{flex-basis:54px; width:54px; height:78px;}
    .bt{font-size:15.5px;}
    .bmeta{font-size:12.5px;}
    .brow{grid-template-columns:54px minmax(0,1fr) auto; gap:12px; row-gap:2px;}
    .bt{grid-column:2; grid-row:1; font-size:15.5px;}
    .brow .cover{grid-row:span 2;}
    .bwho{grid-column:2; grid-row:2; font-size:12.5px;}
    .byear{display:none;}
    .brate{grid-column:3; grid-row:1 / span 2; text-align:right;}
    .brate .st{font-size:14px; letter-spacing:1px;}
  }
</style>

<script>
// 데이터 파일은 항상 최신으로 (GitHub Pages 캐시 우회)
document.write('<script src="books.js?v=' + Date.now() + '"><\/script>');
document.write('<script src="quotes.js?v=' + Date.now() + '"><\/script>');
document.write('<script src="posts.js?v=' + Date.now() + '"><\/script>');
document.write('<script src="slugs.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const stars = n => "★★★★★☆☆☆☆☆".slice(5-(n||0), 10-(n||0));
const PH = ["var(--ph1)","var(--ph2)","var(--ph3)","var(--ph4)","var(--ph5)"];
const phColor = t => PH[[...t].reduce((a,c)=>a+c.charCodeAt(0),0) % PH.length];

/* 화면에서 추가한 책(브라우저 저장분)도 index.html과 똑같이 함께 보여준다 */
const LS_KEY = "myBooks_v1";
const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch(e){ return []; } };
const ALL = [...loadLocal().reverse(), ...BOOKS.slice().reverse()];

const quotesFor = b => [
  ...QUOTES.filter(q => q.b === b.title),
  ...(b.quotes || []).map(t => ({ t, tag:"", d:"" })),
];

/* 이 책을 출처로 쓴 생각 노트 (띄어쓰기 차이는 무시) */
const bkey = s => String(s||"").trim().toLowerCase().replace(/\s+/g,"");
const postsFor = b => (typeof POSTS === "undefined") ? []
  : POSTS.filter(p => p.book && bkey(p.book) === bkey(b.title));
const postHref = p => "./p/" + encodeURIComponent((typeof SLUGS !== "undefined" && SLUGS[p.id]) || p.id) + ".html";

const buyHref = b => b.type === "webtoon"
  ? (b.link || "https://comic.naver.com")
  : "https://search.kyobobook.co.kr/search?keyword=" + encodeURIComponent(b.isbn || b.title);

/* ================= 정렬·필터 상태 ================= */
const PER_PAGE = 15;
let sortKey = "year";      // year | rating
let fType = "all";         // all | book | webtoon
let fRate = "all";         // all | 5 4 3 2 1 | none
let fGenre = "all";
let fYear = "all";
let page = 1;
let openKey = null;        // 펼쳐 둔 책 (제목 기준 — 페이지를 넘겨도 헷갈리지 않게)
let openQuotesAll = false; // 그 책의 문장을 다 펼쳤는지

const typeOf = b => b.type === "webtoon" ? "webtoon" : "book";

function passes(b, skip){
  if(skip !== "type"  && fType  !== "all" && typeOf(b) !== fType) return false;
  if(skip !== "rate"  && fRate  !== "all"){
    if(fRate === "none"){ if(b.rating) return false; }
    else if(String(b.rating || "") !== fRate) return false;
  }
  if(skip !== "genre" && fGenre !== "all" && !(b.genres || []).includes(fGenre)) return false;
  if(skip !== "year"  && fYear  !== "all"){
    if(fYear === "none"){ if(b.published) return false; }
    else if(String(b.published || "") !== fYear) return false;
  }
  return true;
}
/* 어떤 칸의 개수는 '그 칸을 뺀 나머지 필터'로 센다 — 눌러도 0건이 되는 칩이 없도록 */
const countBy = (skip, fn) => ALL.filter(b => passes(b, skip)).filter(fn).length;

function filtered(){
  const list = ALL.filter(b => passes(b));
  // sort는 안정 정렬 — 같은 값이면 원래 순서(최근 등록순)를 지킨다
  if(sortKey === "year")   return list.slice().sort((a,b) => (b.published||0) - (a.published||0));
  if(sortKey === "rating") return list.slice().sort((a,b) => (b.rating||0) - (a.rating||0));
  return list;
}

/* ================= 도구 모음 그리기 ================= */
function chipHTML(list, active){
  return list.map(o =>
    `<button class="${o.k===active?"on":""}" data-k="${esc(o.k)}">${esc(o.label)}${
      o.n === undefined ? "" : `<span class="n">${o.n}</span>`}</button>`).join("");
}
function wire(boxId, set){
  document.querySelectorAll("#"+boxId+" button").forEach(el => el.onclick = () => {
    set(el.dataset.k); page = 1; renderTools(); renderList();
  });
}

function renderTools(){
  document.getElementById("sortChips").innerHTML = chipHTML(
    [{k:"year", label:"출간년도순"}, {k:"rating", label:"별점순"}], sortKey);

  document.getElementById("typeChips").innerHTML = chipHTML([
    {k:"all",     label:"전체", n:countBy("type", ()=>true)},
    {k:"book",    label:"책",   n:countBy("type", b=>typeOf(b)==="book")},
    {k:"webtoon", label:"웹툰", n:countBy("type", b=>typeOf(b)==="webtoon")},
  ], fType);

  document.getElementById("rateChips").innerHTML = chipHTML([
    {k:"all", label:"전체", n:countBy("rate", ()=>true)},
    ...[5,4,3,2,1].map(r => ({k:String(r), label:"★"+r, n:countBy("rate", b=>b.rating===r)})),
    {k:"none", label:"미평가", n:countBy("rate", b=>!b.rating)},
  ], fRate);

  // 장르: 남은 책이 많은 순. 지금 걸러진 결과에 없는 장르는 빼서 헛클릭을 막는다
  const gc = {};
  ALL.filter(b => passes(b, "genre")).forEach(b => (b.genres||[]).forEach(g => gc[g] = (gc[g]||0)+1));
  const genres = Object.entries(gc).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
  document.getElementById("genreSel").innerHTML =
    `<option value="all">장르 전체</option>` +
    genres.map(([g,n]) => `<option value="${esc(g)}"${g===fGenre?" selected":""}>${esc(g)} (${n})</option>`).join("") +
    (fGenre !== "all" && !gc[fGenre] ? `<option value="${esc(fGenre)}" selected>${esc(fGenre)} (0)</option>` : "");

  const yc = {};
  ALL.filter(b => passes(b, "year")).forEach(b => {
    const y = b.published ? String(b.published) : "none";
    yc[y] = (yc[y]||0)+1;
  });
  const years = Object.keys(yc).filter(y => y !== "none").sort((a,b) => b.localeCompare(a));
  document.getElementById("yearSel").innerHTML =
    `<option value="all">출간년도 전체</option>` +
    years.map(y => `<option value="${y}"${y===fYear?" selected":""}>${y}년 (${yc[y]})</option>`).join("") +
    (yc["none"] ? `<option value="none"${fYear==="none"?" selected":""}>출간년도 미상 (${yc["none"]})</option>` : "");

  wire("sortChips", k => sortKey = k);
  wire("typeChips", k => fType = k);
  wire("rateChips", k => fRate = k);
  document.getElementById("genreSel").onchange = e => { fGenre = e.target.value; page = 1; renderTools(); renderList(); };
  document.getElementById("yearSel").onchange  = e => { fYear  = e.target.value; page = 1; renderTools(); renderList(); };
}

function resetFilters(){
  fType = fRate = fGenre = fYear = "all"; page = 1;
  renderTools(); renderList();
}

/* ================= 목록 ================= */
function pageWin(cur, total){
  // 한 번에 열 쪽까지 보여 주고, 그 너머는 화살표로 넘어간다
  const N = 10;
  const start = Math.max(1, Math.min(cur - 4, total - N + 1));
  const end = Math.min(total, start + N - 1);
  return Array.from({length: end - start + 1}, (_, k) => start + k);
}

const QUOTE_PREVIEW = 5;

/* 접힌 줄 — 표지·제목·저자·출판사·출간년도·별점만. 나머지는 눌러야 나온다 */
function rowHTML(b, key, open){
  const cover = b.cover
    ? `<img src="${esc(b.cover)}" alt="${esc(b.title)} 표지" loading="lazy" />`
    : `<div class="ph" style="background:${phColor(b.title)}"><span>${esc(b.title)}</span></div>`;
  const who = [b.author || "저자 미상", b.platform || b.publisher]
    .filter(Boolean).map(esc).join('<span class="sep">·</span>');
  const rate = b.rating
    ? `<span class="st">${stars(b.rating)}</span>`
    : `<span class="no">별점 없음</span>`;
  return `
    <button class="brow" aria-expanded="${open}" data-k="${esc(key)}">
      <span class="cover">${cover}${b.type==="webtoon"?'<span class="wbadge">웹툰</span>':""}</span>
      <span class="bt">${esc(b.title)}</span>
      <span class="brate">${rate}</span>
      <span class="bwho">${who}</span>
      <span class="byear">${b.published ? b.published + "년" : ""}</span>
    </button>`;
}

/* 펼친 상세 — 장르·읽은 해·줄거리·리뷰·문장·생각 노트·구매 링크 */
function detailHTML(b){
  const qs = quotesFor(b), ps = postsFor(b);
  const shown = openQuotesAll ? qs : qs.slice(0, QUOTE_PREVIEW);
  const chips = [...(b.genres || []), b.readYear ? b.readYear + "년에 읽음" : ""].filter(Boolean);
  const lab = (t, n) => `<div class="dlab"><b>${t}</b>${n ? `<span>${n}</span>` : ""}</div>`;
  return `
  <div class="bdetail"><div class="dcard">
    ${chips.length ? `<div class="dchips">${chips.map(c=>`<span>${esc(c)}</span>`).join("")}</div>` : ""}

    <div class="dsec">${lab("내 리뷰")}
      ${b.review ? `<div class="dreview">${esc(b.review)}</div>`
                 : `<div class="dreview dim">아직 리뷰를 쓰지 않았어요.</div>`}
    </div>

    ${qs.length ? `<div class="dsec">${lab("수집한 문장", qs.length + "개")}
      ${shown.map(q => `<div class="dquote">${esc(q.t)}${
          (q.tag||q.d) ? `<span class="qm">${esc(q.tag||"")}${q.tag&&q.d?" · ":""}${esc(q.d||"")}</span>` : ""}</div>`).join("")}
      ${qs.length > QUOTE_PREVIEW
        ? `<button class="more" data-more="q">${openQuotesAll ? "접기" : `문장 ${qs.length - QUOTE_PREVIEW}개 더 보기`}</button>` : ""}
    </div>` : ""}

    ${ps.length ? `<div class="dsec">${lab("이 책에서 쓴 생각 노트", ps.length + "편")}
      ${ps.map(p => `<a class="dnote" href="${postHref(p)}">
        <span class="t">${esc(p.title)}</span>
        <span class="m">${esc(p.category||"노트")}${p.d ? " · " + esc(p.d) : ""}</span></a>`).join("")}
    </div>` : ""}

    ${b.summary ? `<details class="dsum"><summary>책 소개 보기</summary>
      <div class="body">${esc(b.summary)}</div></details>` : ""}

    <div class="dbuy"><a class="golink" href="${esc(buyHref(b))}" target="_blank" rel="noopener">${
      b.type==="webtoon" ? "네이버웹툰에서 보기" : "교보문고에서 보기"} →</a></div>
  </div></div>`;
}

function renderList(){
  const all = filtered();
  const total = Math.max(1, Math.ceil(all.length / PER_PAGE));
  page = Math.min(Math.max(1, page), total);
  const list = all.slice((page-1)*PER_PAGE, page*PER_PAGE);

  document.getElementById("blist").innerHTML = list.length ? list.map(b => {
    const key = b.title, open = openKey === key;
    return `<div class="bitem${open?" open":""}">${rowHTML(b, key, open)}${open ? detailHTML(b) : ""}</div>`;
  }).join("") : `<div class="empty">조건에 맞는 책이 없어요. 필터를 조금 풀어 보세요.</div>`;

  document.querySelectorAll("#blist .brow").forEach(el => el.onclick = () => {
    const k = el.dataset.k;
    openKey = (openKey === k) ? null : k;
    openQuotesAll = false;
    renderList();
    if(openKey === k){
      const row = document.querySelector(`#blist .brow[data-k="${CSS.escape(k)}"]`);
      const y = row.getBoundingClientRect().top + window.scrollY - 70;
      if(row.getBoundingClientRect().top < 60) window.scrollTo({top:y, behavior:"smooth"});
    }
  });
  document.querySelectorAll('#blist [data-more="q"]').forEach(el => el.onclick = () => {
    openQuotesAll = !openQuotesAll; renderList();
  });

  // 요약줄 — 지금 몇 권을 보고 있는지, 필터가 걸려 있는지
  const on = fType!=="all" || fRate!=="all" || fGenre!=="all" || fYear!=="all";
  document.getElementById("tsum").innerHTML =
    `<span><b>${all.length}권</b>${on ? " (전체 "+ALL.length+"권 중)" : ""} · ${page} / ${total} 페이지</span>`
    + (on ? `<button class="reset" id="resetBtn">필터 초기화</button>` : "");
  const rb = document.getElementById("resetBtn");
  if(rb) rb.onclick = resetFilters;

  document.getElementById("pager").innerHTML = total > 1 ? `
    <button onclick="goPage(${page-1})" ${page===1?"disabled":""}>‹</button>
    ${pageWin(page,total).map(p=>`<button class="${p===page?"cur":""}" onclick="goPage(${p})">${p}</button>`).join("")}
    <button onclick="goPage(${page+1})" ${page===total?"disabled":""}>›</button>` : "";
}
function goPage(p){
  page = p; openKey = null; renderList();
  document.getElementById("listView").scrollIntoView({behavior:"smooth", block:"start"});
}

/* 히어로 통계와 셈을 맞춘다 — '권의 책'은 웹툰을 빼고 센다 */
const toonN = ALL.filter(b => typeOf(b) === "webtoon").length;
document.getElementById("headSub").innerHTML =
  `지금까지 책 <b>${ALL.length - toonN}권</b>${toonN ? ` · 웹툰 <b>${toonN}편</b>` : ""}. 제목을 누르면 줄거리·리뷰·문장·생각 노트가 펼쳐집니다.`;

renderTools(); renderList();
</script>
