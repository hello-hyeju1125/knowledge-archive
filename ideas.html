<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>소설의 재료 — 헬로의 서재</title>
<meta name="description" content="헬로가 책을 읽다 떠올린 소설의 재료들. 인물, 설정, 장면의 씨앗을 모읍니다." />
<meta property="og:type" content="website" />
<meta property="og:title" content="소설의 재료 — 헬로의 서재" />
<meta property="og:description" content="읽다가 떠오른 이야기의 씨앗들" />
<link rel="canonical" href="https://hellmeone.com/ideas.html" />
<style>
@font-face{
  font-family:"NanumSquareNeo";
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/NanumSquareNeo-Variable.woff2") format("woff2");
  font-weight:300 900; font-display:swap;
}
</style>
<style>
  :root{
    --bg:#ECFCFF; --text:#0E2049; --text-2:#4A5C82; --text-3:#8CA0BF;
    --line:#CBE9F2; --card-line:rgba(41,74,255,.4);
    --accent:#294AFF; --accent-hover:#1E3AE0;
    --mint:#37FFA9; --mint-soft:#D9FFEF; --mint-text:#00875A;
    --card:#ffffff; --shadow:0 2px 14px rgba(41,74,255,.07);
    --shadow-lg:0 10px 34px rgba(41,74,255,.14);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#050B1D; --text:#EAF4FF; --text-2:#9FB3D9; --text-3:#5F7396;
      --line:#1B2A4E; --card-line:rgba(94,120,255,.5);
      --accent:#5E78FF; --accent-hover:#7B90FF;
      --mint:#37FFA9; --mint-soft:#0C3A2B; --mint-text:#37FFA9;
      --card:#0D1730; --shadow:0 2px 14px rgba(0,0,0,.5);
      --shadow-lg:0 10px 34px rgba(0,0,0,.65);
    }
  }
  *{box-sizing:border-box; margin:0;}
  body{-webkit-user-select:none; -moz-user-select:none; user-select:none;}
  input, textarea{-webkit-user-select:text; user-select:text;}
  body{
    font-family:"NanumSquareNeo","Apple SD Gothic Neo",-apple-system,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent); text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .marker{background:linear-gradient(transparent 62%, var(--mint) 62%, var(--mint) 92%, transparent 92%); padding:0 3px;}

  nav{
    position:sticky; top:0; z-index:50; height:52px;
    display:flex; align-items:center; gap:22px; padding:0 max(22px,4vw);
    background:color-mix(in srgb, var(--bg) 75%, transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line);
  }
  nav .brand{font-size:15px; font-weight:800; color:var(--text);}
  nav .links{margin-left:auto; display:flex; gap:20px; align-items:center;}
  nav .links a{color:var(--text-2); font-size:13px;}
  nav .links a:hover{color:var(--text); background:linear-gradient(transparent 76%, var(--mint) 76%, var(--mint) 96%, transparent 96%);}
  nav .add-mini{background:var(--accent); color:#fff !important; border:none; border-radius:980px;
    font-size:12.5px; padding:6px 14px; font-weight:600;}
  @media (max-width:640px){
    nav{gap:12px; padding:0 16px;}
    nav .brand{font-size:14px; white-space:nowrap;}
    nav .links{gap:13px;} nav .links a{font-size:12.5px; white-space:nowrap;}
    nav .add-mini{display:none;}
  }

  .wrap{max-width:1100px; margin:0 auto; padding:46px 20px 100px;}
  .head h1{font-size:clamp(26px,4.5vw,34px); font-weight:900; letter-spacing:-0.025em;}
  .head p{color:var(--text-2); font-size:14.5px; margin-top:10px;}
  .bar{display:flex; gap:8px; flex-wrap:wrap; margin-top:22px; align-items:center;}
  .bar button{
    border:1px solid var(--line); background:var(--card); color:var(--text-2);
    font-size:13px; font-weight:600; padding:7px 16px; border-radius:980px;
  }
  .bar button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .bar .mix{margin-left:auto; border-color:var(--accent); color:var(--accent); font-weight:700;}
  .bar .mix:hover{background:var(--accent); color:#fff;}

  /* 태그 색상 (노트와 동일 팔레트) */
  .tag{display:inline-block; padding:2px 10px; border-radius:980px; font-weight:700; font-size:11.5px;}
  .tag.c0{color:#00875A; background:#D9FFEF;}
  .tag.c1{color:#1E3AE0; background:#E1E8FF;}
  .tag.c2{color:#9A5B00; background:#FFF0D6;}
  .tag.c3{color:#8A2BC4; background:#F4E6FF;}
  .tag.c4{color:#0E7490; background:#DCF5FB;}
  .tag.c5{color:#B03060; background:#FFE4EF;}
  @media (prefers-color-scheme: dark){
    .tag.c0{color:#37FFA9; background:#0C3A2B;} .tag.c1{color:#9DB0FF; background:#16224A;}
    .tag.c2{color:#FFD08A; background:#3A2C14;} .tag.c3{color:#DCB0FF; background:#2C1A3D;}
    .tag.c4{color:#8FE2F5; background:#0F2E38;} .tag.c5{color:#FFA8C8; background:#3A1626;}
  }
  .bar button.on.c0{background:#00875A; border-color:#00875A; color:#fff;}
  .bar button.on.c1{background:#1E3AE0; border-color:#1E3AE0; color:#fff;}
  .bar button.on.c2{background:#9A5B00; border-color:#9A5B00; color:#fff;}
  .bar button.on.c3{background:#8A2BC4; border-color:#8A2BC4; color:#fff;}
  .bar button.on.c4{background:#0E7490; border-color:#0E7490; color:#fff;}
  .bar button.on.c5{background:#B03060; border-color:#B03060; color:#fff;}

  /* 벽돌(Masonry) 보드 */
  .board{columns:3 280px; column-gap:16px; margin-top:26px;}
  @media (max-width:720px){ .board{columns:1;} }
  .icard{
    break-inside:avoid; background:var(--card); border:1px solid var(--card-line);
    border-radius:16px; padding:18px 18px 15px; margin-bottom:16px;
    transition:transform .2s, box-shadow .2s; position:relative;
  }
  .icard:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg);}
  .icard .pin{position:absolute; top:-7px; right:14px; font-size:15px;}
  .icard .it{font-size:15.5px; font-weight:700; line-height:1.55; margin-top:10px; word-break:keep-all;}
  .icard .ib{font-size:13.5px; color:var(--text-2); line-height:1.75; margin-top:9px; word-break:keep-all;}
  .icard .ib.locked{
    filter:blur(4.5px); user-select:none; pointer-events:none;
    -webkit-mask-image:linear-gradient(180deg, #000 30%, transparent 100%);
    mask-image:linear-gradient(180deg, #000 30%, transparent 100%);
  }
  .icard .im{font-size:11.5px; color:var(--text-3); margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;}
  .empty{text-align:center; color:var(--text-3); padding:70px 0; font-size:14px;}

  /* 섞어보기 */
  .mixbox{
    display:none; margin-top:26px; padding:22px; border-radius:18px;
    background:var(--card); border:1.5px dashed var(--accent);
  }
  .mixbox.show{display:block;}
  .mixbox h3{font-size:15px; font-weight:800; margin-bottom:14px;}
  .mixgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
  .mixitem{background:var(--bg); border-radius:12px; padding:14px;}
  .mixitem .mt{font-size:14px; font-weight:700; line-height:1.5; margin-top:8px;}

  /* 티저 안내 */
  .teaser{
    margin-top:40px; padding:24px; border-radius:18px; background:var(--card);
    border:1px solid var(--card-line); text-align:center;
  }
  .teaser p{font-size:14px; color:var(--text-2); line-height:1.8;}
  .teaser b{color:var(--text);}
  .teaser a.cta{
    display:inline-block; margin-top:14px; border:1.5px solid var(--accent); color:var(--accent);
    font-size:14px; font-weight:700; padding:10px 22px; border-radius:980px;
  }
  .teaser a.cta:hover{background:var(--accent); color:#fff;}

  footer{border-top:1px solid var(--line); padding:32px 20px 56px; text-align:center;}
  footer .f-brand{font-size:14px; font-weight:800;}
  footer p{color:var(--text-3); font-size:12.5px; margin-top:8px;}
</style>
</head>
<body>

<nav>
  <a class="brand" href="./index.html">헬로의 서재</a>
  <div class="links">
    <a href="./index.html#quotes">문장</a>
    <a href="./index.html#books">책</a>
    <a href="./index.html#graph-sec">지도</a>
    <a href="./notes.html">노트</a>
    <a href="./ideas.html" style="color:var(--text); font-weight:700;">재료</a>
    <a class="add-mini" href="./admin.html">서재 주인 접근</a>
  </div>
</nav>

<div class="wrap">
  <div class="head">
    <h1><span class="marker">소설의 재료</span></h1>
    <p>책을 읽다 떠오른 이야기의 씨앗들. 언젠가 소설이 될지도 모르는 조각입니다.</p>
  </div>
  <div class="bar" id="bar"></div>

  <div class="mixbox" id="mixbox">
    <h3>🎲 이 재료들을 섞으면?</h3>
    <div class="mixgrid" id="mixgrid"></div>
  </div>

  <div class="board" id="board"></div>

  <div class="teaser" id="teaser">
    <p><b>재료의 속살은 아직 접어두었습니다.</b><br>
      씨앗이 어떤 이야기로 자랄지 궁금하시다면, 혹은 함께 굴려보고 싶은 생각이 있다면 —</p>
    <a class="cta" href="mailto:hjagape@gmail.com?subject=%ED%97%AC%EB%A1%9C%EC%9D%98%20%EC%84%9C%EC%9E%AC%20%EC%86%8C%EC%84%A4%EC%9D%98%20%EC%9E%AC%EB%A3%8C%EC%97%90%20%EB%8C%80%ED%95%B4">헬로에게 연락하기 →</a>
  </div>
</div>

<footer>
  <div class="f-brand">헬로의 서재</div>
  <p>읽는 사람, 헬로. 책과 문장을 수집합니다.</p>
</footer>

<script>
document.write('<script src="ideas.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const tagClass = (() => {
  const order = [...new Set(IDEAS.map(i=>i.tag).filter(Boolean))].sort();
  return t => "c" + (Math.max(0, order.indexOf(String(t||"재료"))) % 6);
})();
/* 주인 여부: 관리 페이지에서 토큰을 연결한 브라우저면 전체 공개 */
const isOwner = !!localStorage.getItem("ghToken");

let activeTag = "전체";
function renderBar(){
  const tags = [...new Set(IDEAS.map(i=>i.tag).filter(Boolean))];
  const counts = { "전체": IDEAS.length };
  IDEAS.forEach(i => counts[i.tag] = (counts[i.tag]||0)+1);
  document.getElementById("bar").innerHTML =
    ["전체", ...tags].map(t => {
      const cls = t==="전체" ? "" : tagClass(t);
      return `<button class="${t===activeTag?"on "+cls:cls}" data-t="${esc(t)}">${esc(t)} <span style="opacity:.55">${counts[t]||0}</span></button>`;
    }).join("") +
    (IDEAS.length >= 2 ? `<button class="mix" onclick="mix()">🎲 섞어보기</button>` : "");
  document.querySelectorAll("#bar button[data-t]").forEach(el => el.onclick = () => {
    activeTag = el.dataset.t; renderBar(); renderBoard();
  });
}

function renderBoard(){
  const list = (activeTag==="전체" ? IDEAS : IDEAS.filter(i=>i.tag===activeTag))
    .slice().sort((a,b) => (b.pin?1:0)-(a.pin?1:0));
  document.getElementById("board").innerHTML = list.length ? list.map(i => `
    <div class="icard">
      ${i.pin ? `<span class="pin">📌</span>` : ""}
      <span class="tag ${tagClass(i.tag)}">${esc(i.tag||"재료")}</span>
      <div class="it">${esc(i.title)}</div>
      ${i.body ? `<div class="ib ${isOwner?"":"locked"}">${esc(isOwner ? i.body : i.body.slice(0,60))}</div>` : ""}
      <div class="im">${i.book ? `<span>📕 ${esc(i.book)}</span>` : ""}<span>${i.d||""}</span></div>
    </div>`).join("")
    : `<div class="empty">아직 재료가 없어요. 서재 주인의 방에서 첫 씨앗을 심어보세요.</div>`;
  document.getElementById("teaser").style.display = (isOwner || !IDEAS.length) ? "none" : "";
}

function mix(){
  const pool = IDEAS.slice();
  const n = Math.min(3, pool.length);
  const picked = [];
  while(picked.length < n && pool.length){
    picked.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  }
  document.getElementById("mixgrid").innerHTML = picked.map(i => `
    <div class="mixitem">
      <span class="tag ${tagClass(i.tag)}">${esc(i.tag||"재료")}</span>
      <div class="mt">${esc(i.title)}</div>
    </div>`).join("");
  document.getElementById("mixbox").classList.add("show");
}

renderBar(); renderBoard();

/* 콘텐츠 보호 */
(function(){
  const exempt = e => e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA");
  ["copy","cut","dragstart","contextmenu"].forEach(ev =>
    document.addEventListener(ev, e => { if(!exempt(e)) e.preventDefault(); }));
})();
</script>
</body>
</html>
