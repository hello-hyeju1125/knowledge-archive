<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>빛나는 아이디어 — 헬로의 서재</title>
<meta name="description" content="헬로가 책을 읽다 떠올린 생각의 조각들. 언젠가 이야기가 될지도 모르는 아이디어." />
<meta property="og:type" content="website" />
<meta property="og:title" content="빛나는 아이디어 — 헬로의 서재" />
<meta property="og:description" content="읽다가 떠오른 생각의 조각들" />
<link rel="canonical" href="https://hellmeone.com/ideas.html" />
<style>
@font-face{
  font-family:"NanumSquareNeo";
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/NanumSquareNeo-Variable.woff2") format("woff2");
  font-weight:300 900; font-display:swap;
}
</style>
<style>
  :root{
    --bg:#ECFCFF; --text:#0E2049; --text-2:#4A5C82; --text-3:#8CA0BF;
    --line:#CBE9F2; --card-line:rgba(41,74,255,.4);
    --accent:#294AFF; --accent-hover:#1E3AE0;
    --mint:#37FFA9; --mint-soft:#D9FFEF; --mint-text:#00875A;
    --card:#ffffff; --shadow:0 2px 14px rgba(41,74,255,.07);
    --shadow-lg:0 10px 34px rgba(41,74,255,.14);
    --heart:#FF4D6D;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#050B1D; --text:#EAF4FF; --text-2:#9FB3D9; --text-3:#5F7396;
      --line:#1B2A4E; --card-line:rgba(94,120,255,.5);
      --accent:#5E78FF; --accent-hover:#7B90FF;
      --mint:#37FFA9; --mint-soft:#0C3A2B; --mint-text:#37FFA9;
      --card:#0D1730; --shadow:0 2px 14px rgba(0,0,0,.5);
      --shadow-lg:0 10px 34px rgba(0,0,0,.65);
      --heart:#FF6B85;
    }
  }
  *{box-sizing:border-box; margin:0;}
  body{-webkit-user-select:none; -moz-user-select:none; user-select:none;}
  input, textarea{-webkit-user-select:text; user-select:text;}
  body{
    font-family:"NanumSquareNeo","Apple SD Gothic Neo",-apple-system,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6; letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent); text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .marker{background:linear-gradient(transparent 62%, var(--mint) 62%, var(--mint) 92%, transparent 92%); padding:0 3px;}

  nav{
    position:sticky; top:0; z-index:50; height:52px;
    display:flex; align-items:center; gap:22px; padding:0 max(22px,4vw);
    background:color-mix(in srgb, var(--bg) 75%, transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line);
  }
  nav .brand{font-size:15px; font-weight:800; color:var(--text);}
  nav .links{margin-left:auto; display:flex; gap:20px; align-items:center;}
  nav .links a{color:var(--text-2); font-size:13px;}
  nav .links a:hover{color:var(--text); background:linear-gradient(transparent 76%, var(--mint) 76%, var(--mint) 96%, transparent 96%);}
  nav .add-mini{background:var(--accent); color:#fff !important; border:none; border-radius:980px;
    font-size:12.5px; padding:6px 14px; font-weight:600;}
  @media (max-width:640px){
    nav{gap:12px; padding:0 16px;}
    nav .brand{font-size:14px; white-space:nowrap;}
    nav .links{gap:13px;} nav .links a{font-size:12.5px; white-space:nowrap;}
    nav .add-mini{display:none;}
  }

  .wrap{max-width:1100px; margin:0 auto; padding:46px 20px 100px;}
  .head h1{font-size:clamp(26px,4.5vw,34px); font-weight:900; letter-spacing:-0.025em;}
  .head p{color:var(--text-2); font-size:14.5px; margin-top:10px;}

  /* 벽돌(Masonry) 보드 */
  .board{columns:3 300px; column-gap:16px; margin-top:30px;}
  @media (max-width:720px){ .board{columns:1;} }
  .icard{
    break-inside:avoid; background:var(--card); border:1px solid var(--card-line);
    border-radius:16px; padding:20px; margin-bottom:16px;
    transition:transform .2s, box-shadow .2s;
  }
  .icard:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg);}
  .icard .it{
    font-size:14.5px; line-height:1.85; color:var(--text); word-break:keep-all;
    transition:filter .35s ease;
  }
  .icard .it.locked{
    filter:blur(4.5px); pointer-events:none;
    -webkit-mask-image:linear-gradient(180deg,#000 25%,rgba(0,0,0,.25) 100%);
    mask-image:linear-gradient(180deg,#000 25%,rgba(0,0,0,.25) 100%);
  }
  .icard .foot{
    display:flex; align-items:center; gap:10px; margin-top:16px;
    padding-top:13px; border-top:1px solid var(--line);
  }
  .icard .date{font-size:11.5px; color:var(--text-3); margin-left:auto;}
  .like{
    display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line);
    background:var(--bg); color:var(--text-2); border-radius:980px;
    font-size:13px; font-weight:700; padding:7px 15px; transition:all .18s;
  }
  .like:hover{border-color:var(--heart); color:var(--heart);}
  .like.on{background:var(--heart); border-color:var(--heart); color:#fff;}
  .like .hh{font-size:14px; line-height:1;}
  .like.on .hh{animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.5);}100%{transform:scale(1);}}
  .hint{font-size:11.5px; color:var(--text-3);}
  .empty{text-align:center; color:var(--text-3); padding:70px 0; font-size:14px;}

  footer{border-top:1px solid var(--line); padding:32px 20px 56px; text-align:center;}
  footer .f-brand{font-size:14px; font-weight:800;}
  footer p{color:var(--text-3); font-size:12.5px; margin-top:8px;}
</style>
</head>
<body>

<nav>
  <a class="brand" href="./index.html">헬로의 서재</a>
  <div class="links">
    <a href="./index.html#quotes">문장</a>
    <a href="./index.html#books">책</a>
    <a href="./index.html#graph-sec">지도</a>
    <a href="./notes.html">노트</a>
    <a href="./ideas.html" style="color:var(--text); font-weight:700;">아이디어</a>
    <a class="add-mini" href="./admin.html">서재 주인 접근</a>
  </div>
</nav>

<div class="wrap">
  <div class="head">
    <h1><span class="marker">빛나는 아이디어</span></h1>
    <p id="headDesc">읽다가 떠오른 생각의 조각들. 하트를 누르면 아이디어가 펼쳐집니다.</p>
  </div>
  <div class="board" id="board"></div>
</div>

<footer>
  <div class="f-brand">헬로의 서재</div>
  <p>읽는 사람, 헬로. 책과 문장을 수집합니다.</p>
</footer>

<script>
document.write('<script src="ideas.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const isOwner = !!localStorage.getItem("ghToken");   // 관리 토큰이 있으면 주인 → 전부 공개
const NS = "hellmeone-ideas";                        // 좋아요 카운터 네임스페이스
const likedKey = id => "liked_" + id;
const hasLiked = id => !!localStorage.getItem(likedKey(id));

function render(){
  const box = document.getElementById("board");
  if(!IDEAS.length){
    box.innerHTML = `<div class="empty">아직 아이디어가 없어요. 서재 주인의 방에서 첫 조각을 남겨보세요.</div>`;
    return;
  }
  if(isOwner) document.getElementById("headDesc").textContent = "읽다가 떠오른 생각의 조각들.";
  box.innerHTML = IDEAS.map(i => {
    const open = isOwner || hasLiked(i.id);
    return `
    <div class="icard" data-id="${esc(i.id)}">
      <div class="it ${open?"":"locked"}">${esc(i.text)}</div>
      <div class="foot">
        <button class="like ${hasLiked(i.id)?"on":""}" data-id="${esc(i.id)}">
          <span class="hh">${hasLiked(i.id)?"♥":"♡"}</span><span class="cnt">–</span>
        </button>
        ${open ? "" : `<span class="hint">하트를 누르면 펼쳐져요</span>`}
        <span class="date">${i.d||""}</span>
      </div>
    </div>`;
  }).join("");
  box.querySelectorAll(".like").forEach(el => el.onclick = () => toggleLike(el.dataset.id, el));
  loadCounts();
}

/* 저장된 좋아요 수 불러오기 (읽기 전용) */
async function loadCounts(){
  await Promise.all(IDEAS.map(async i => {
    const el = document.querySelector(`.like[data-id="${CSS.escape(i.id)}"] .cnt`);
    if(!el) return;
    try{
      const r = await fetch(`https://abacus.jasoncameron.dev/get/${NS}/${encodeURIComponent(i.id)}`);
      const d = await r.json();
      el.textContent = typeof d.value === "number" ? d.value : 0;
    }catch(e){ el.textContent = "0"; }
  }));
}

/* 하트 = 좋아요 + 내용 펼치기 (한 번만 집계) */
async function toggleLike(id, btn){
  const card = btn.closest(".icard");
  const body = card.querySelector(".it");
  const hint = card.querySelector(".hint");
  body.classList.remove("locked");
  if(hint) hint.remove();
  if(hasLiked(id)) return;                 // 이미 누른 사람은 카운트 그대로
  localStorage.setItem(likedKey(id), "1");
  btn.classList.add("on");
  btn.querySelector(".hh").textContent = "♥";
  const cnt = btn.querySelector(".cnt");
  cnt.textContent = (parseInt(cnt.textContent) || 0) + 1;   // 즉시 반응
  try{
    const r = await fetch(`https://abacus.jasoncameron.dev/hit/${NS}/${encodeURIComponent(id)}`);
    const d = await r.json();
    if(typeof d.value === "number") cnt.textContent = d.value;
  }catch(e){}
}

render();

/* 콘텐츠 보호 */
(function(){
  const exempt = e => e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA");
  ["copy","cut","dragstart","contextmenu"].forEach(ev =>
    document.addEventListener(ev, e => { if(!exempt(e)) e.preventDefault(); }));
})();
</script>
</body>
</html>
